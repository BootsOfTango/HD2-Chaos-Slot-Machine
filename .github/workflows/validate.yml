name: Validate source

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    name: Source tests and dependency audit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies (no signing or publication credentials)
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Test source, CSP, catalog and assets
        run: npm test

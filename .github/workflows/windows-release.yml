name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version to use for the test build'
        required: true
        default: '22'
        type: string
      sign-build:
        description: 'Sign this manual build with Azure Trusted Signing secrets'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  windows-build:
    name: Validate, build, and package Windows artifacts
    runs-on: windows-latest
    env:
      NODE_VERSION: ${{ inputs.node-version || '22' }}
      WINDOWS_SIGNING_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/') || inputs.sign-build == true }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
      WINDOWS_SIGNING_PUBLISHER_NAME: ${{ secrets.WINDOWS_SIGNING_PUBLISHER_NAME }}
      WINDOWS_SIGNING_TIMESTAMP_RFC3161: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_RFC3161 || 'http://timestamp.acs.microsoft.com' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          $actualTag = "${{ github.ref_name }}"
          if ($actualTag -ne $expectedTag) {
            Write-Error "Tag '$actualTag' does not match package.json version '$($package.version)' (expected '$expectedTag')."
            exit 1
          }
          Write-Host "Tag $actualTag matches package.json version $($package.version)."

      - name: Run catalog validation
        run: npm run validate:catalog

      - name: Run asset validation
        run: npm run validate:assets

      - name: Run storage and application tests
        run: npm test

      - name: Build Windows ZIP and offline installer
        run: npm run build:win

      - name: Verify Windows artifacts and generate checksums
        run: python scripts/verify_win_zip.py

      - name: Verify signed ZIP application and installer before publishing
        if: env.WINDOWS_SIGNING_REQUIRED == 'true'
        shell: pwsh
        run: ./scripts/verify_windows_signature.ps1

      - name: Verify exact artifact names
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $required = @(
            "dist/Helldivers-2-Chaos-Slot-Machine-v$($package.version)-win-x64.zip",
            "dist/Helldivers-2-Chaos-Slot-Machine-v$($package.version)-win-x64.zip.sha256",
            "dist/Helldivers-2-Chaos-Slot-Machine-Setup-v$($package.version)-win-x64.exe",
            "dist/Helldivers-2-Chaos-Slot-Machine-Setup-v$($package.version)-win-x64.exe.sha256"
          )
          foreach ($artifact in $required) {
            if (!(Test-Path -LiteralPath $artifact)) {
              Write-Error "Required artifact is missing: $artifact"
              exit 1
            }
          }
          Write-Host 'All expected versioned Windows artifacts are present.'

      - name: Upload test build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-build-${{ github.run_number }}
          path: |
            dist/Helldivers-2-Chaos-Slot-Machine-v*-win-x64.zip
            dist/Helldivers-2-Chaos-Slot-Machine-v*-win-x64.zip.sha256
            dist/Helldivers-2-Chaos-Slot-Machine-Setup-v*-win-x64.exe
            dist/Helldivers-2-Chaos-Slot-Machine-Setup-v*-win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Attach installer, ZIP, and checksums to matching GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/Helldivers-2-Chaos-Slot-Machine-v*-win-x64.zip
            dist/Helldivers-2-Chaos-Slot-Machine-v*-win-x64.zip.sha256
            dist/Helldivers-2-Chaos-Slot-Machine-Setup-v*-win-x64.exe
            dist/Helldivers-2-Chaos-Slot-Machine-Setup-v*-win-x64.exe.sha256
          fail_on_unmatched_files: true
